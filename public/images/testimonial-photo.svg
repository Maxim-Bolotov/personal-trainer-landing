<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternTransform="rotate(20)" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <rect width="8" height="40" fill="#ff2332" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="400" height="520" fill="url(#g)"/>
  <rect width="400" height="520" fill="url(#stripes)"/>
  <circle cx="50%" cy="42%" r="60" fill="none" stroke="#ff2332" stroke-width="2" opacity="0.5"/>
  <text x="50%" y="50%" text-anchor="middle" fill="#909090" font-family="sans-serif" font-size="20" dy=".3em">До</text>
</svg>
