<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternTransform="rotate(20)" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <rect width="8" height="40" fill="#ff2332" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#g)"/>
  <rect width="640" height="480" fill="url(#stripes)"/>
  <circle cx="50%" cy="42%" r="80" fill="none" stroke="#ff2332" stroke-width="2" opacity="0.5"/>
  <text x="50%" y="50%" text-anchor="middle" fill="#909090" font-family="sans-serif" font-size="29" dy=".3em">CTA photo</text>
  <text x="50%" y="58%" text-anchor="middle" fill="#5c5c5c" font-family="sans-serif" font-size="16" dy=".3em">640x480</text>
</svg>
